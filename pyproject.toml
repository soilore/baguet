[build-system]
requires = ["setuptools>=68", "wheel", "cryptography>=41"]
build-backend = "setuptools.build_meta"

[project]
name = "baguet"
version = "1.0.3"
description = "BAGUET 1.0 — Algebraic Lossless Memory Engine & Zero-Decompression Compute SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-Baguet-EULA-1.0" }
authors = [
  { name = "Soilore", email = "contact@soilore.com" },
]
keywords = ["compression", "lossless", "ai", "rag", "kv-cache", "codec", "rust", "simd", "ed25519"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Archiving :: Compression",
]
dependencies = [
  "numpy>=1.24",
  "cryptography>=41",
]

[project.urls]
Homepage = "https://baguet.soilore.com"
Documentation = "https://baguet.soilore.com/legal/guide"
Repository = "https://github.com/soilore/baguet"
Issues = "https://github.com/soilore/baguet/issues"

[project.optional-dependencies]
torch = ["torch>=2.1", "ml_dtypes>=0.3"]

[project.scripts]
baguet = "baguet_sdk:main"
Activate-Baguet = "baguet_sdk:activate_main"
baguet-studio = "baguet_sdk:studio_main"
baguet-desktop-compress = "baguet_sdk:desktop_compress_main"

[tool.setuptools]
py-modules = ["baguet_sdk", "baguet_sdk_layer"]
include-package-data = true

[tool.setuptools.package-data]
"*" = [
    "baguet.toml",
    "engine-baguet.py",
    "engine-baguet.pyc",
    "libbaguet_rust_core.dylib",
    "libbaguet_rust_core.so",
    "baguet_rust_core.dll",
    "DIST-INTEGRITY.json",
    "studio/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
