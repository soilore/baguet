{% set version = "1.0.0" %}
package:
  name: baguet-sdk
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  script: python "{{ RECIPE_DIR }}/build.py"

requirements:
  build:
    - python >=3.11
    - pip
    - setuptools >=68
    - wheel
  host:
    - python >=3.11
    - numpy >=1.24
    - cryptography >=41
    - zlib
  run:
    - python >=3.11
    - numpy >=1.24
    - cryptography >=41
    - zlib

about:
  license: BUSL-1.1 AND MIT
  summary: BAGUET v1.0.0 — Algebraic Lossless Memory Engine & Zero-Decompression Compute SDK
